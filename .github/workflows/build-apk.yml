name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write   # 允许把 APK 发布到 GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pip git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer "cython<3.0" pexpect

      # Android Gradle Plugin 需要 JDK 17，而 runner 默认 JAVA_HOME 是 JDK 11
      - name: Switch to JDK 17
        run: |
          for d in /usr/lib/jvm/temurin-17-jdk-amd64 \
                   /usr/lib/jvm/java-17-openjdk-amd64; do
            if [ -d "$d" ]; then
              echo "JAVA_HOME=$d" >> "$GITHUB_ENV"
              echo "$d/bin" >> "$GITHUB_PATH"
              echo "using $d"
              break
            fi
          done
          java -version

      - name: Build debug APK
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee build.log
        timeout-minutes: 160

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: error

      # 标签推送时把 APK 发布到 GitHub Release（公开仓库可免登录直接下载）
      - name: Publish APK to Release
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      # 把构建日志推到 ci-logs 分支，方便无需登录即可排查
      - name: Save build log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "ci@local"
          git config --global user.name "ci"
          git fetch origin main
          git checkout -B ci-logs origin/main
          mkdir -p ci-logs
          cp "$GITHUB_WORKSPACE/build.log" "ci-logs/run-${GITHUB_RUN_NUMBER}.log"
          git add ci-logs
          git commit -m "ci: build log for run ${GITHUB_RUN_NUMBER}" || true
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/liguokun66/BloodPressureAssistant.git" ci-logs || true
