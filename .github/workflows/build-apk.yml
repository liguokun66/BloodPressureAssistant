name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write   # 允许把 APK 发布到 GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pip git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer "cython<3.0" pexpect

      # Android Gradle Plugin 需要 JDK 17，而 runner 默认 JAVA_HOME 是 JDK 11
      - name: Switch to JDK 17
        run: |
          for d in /usr/lib/jvm/temurin-17-jdk-amd64 \
                   /usr/lib/jvm/java-17-openjdk-amd64; do
            if [ -d "$d" ]; then
              echo "JAVA_HOME=$d" >> "$GITHUB_ENV"
              echo "$d/bin" >> "$GITHUB_PATH"
              echo "using $d"
              break
            fi
          done
          java -version

      # 让 APK 文件名 / versionName 带上真实版本号（从 tag 推导，
      # 例如 bpassistant-1.0.17-arm64-v8a-debug.apk），避免每个 Release 同名
      - name: Sync version from tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ -z "$VER" ] || [ "$VER" = "${GITHUB_REF_NAME}" ]; then
            VER="1.0.0"
          fi
          export VER
          python3 - <<'PY'
          import os, pathlib, re
          ver = os.environ['VER']
          p = pathlib.Path('buildozer.spec')
          s = p.read_text(encoding='utf-8')
          s2, n = re.subn(r'(?m)^version\s*=.*$', 'version = %s' % ver, s)
          if n != 1:
              raise SystemExit('buildozer.spec 里找到 %d 个 version 行，放弃' % n)
          p.write_text(s2, encoding='utf-8')
          print('buildozer.spec version ->', ver)
          PY
          grep -n '^version' buildozer.spec

      # 中文离线语音模型（Vosk）：构建前下载解压到 models/，
      # buildozer.spec 的 android.add_assets 会整树打进 APK assets/vosk-model
      - name: Download Vosk Chinese model
        run: |
          mkdir -p models
          curl -fL --retry 3 --connect-timeout 30 \
            -o /tmp/vosk-model.zip \
            https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip
          unzip -q -o /tmp/vosk-model.zip -d models/
          du -sh models/* || true

      - name: Build debug APK
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee build.log
        timeout-minutes: 160

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: error

      # 标签推送时把 APK 发布到 GitHub Release（公开仓库可免登录直接下载）
      - name: Publish APK to Release
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      # 把构建日志推到 ci-logs 分支，方便无需登录即可排查
      - name: Save build log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "ci@local"
          git config --global user.name "ci"
          git fetch origin main
          git checkout -B ci-logs origin/main
          mkdir -p ci-logs
          cp "$GITHUB_WORKSPACE/build.log" "ci-logs/run-${GITHUB_RUN_NUMBER}.log"
          git add ci-logs
          git commit -m "ci: build log for run ${GITHUB_RUN_NUMBER}" || true
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/liguokun66/BloodPressureAssistant.git" ci-logs || true
