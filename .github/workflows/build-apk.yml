name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pip git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer "cython<3.0"

      # 预先写入 SDK 许可证，避免 sdkmanager 交互询问导致构建失败
      - name: Pre-accept Android SDK licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK/licenses"
          printf '%s\n' \
            8933bad161af4178b1185d1a37fbf41ea5269c55 \
            d56f5187479451eabf01fb78af6dfcb131a6481e \
            24333f8a63b6825ea9c5514f83c2829b004d1fee \
            d975f751698a77b662f1254ddbeed3901e976f5a \
            > "$SDK/licenses/android-sdk-license"
          ls -l "$SDK/licenses"

      - name: Build debug APK
        run: |
          set -o pipefail
          (yes | buildozer android debug) 2>&1 | tee build.log
        timeout-minutes: 80

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: error

      # 把构建日志推到 ci-logs 分支，方便无需登录即可排查
      - name: Save build log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "ci@local"
          git config --global user.name "ci"
          git fetch origin main
          git checkout -B ci-logs origin/main
          mkdir -p ci-logs
          cp "$GITHUB_WORKSPACE/build.log" "ci-logs/run-${GITHUB_RUN_NUMBER}.log"
          git add ci-logs
          git commit -m "ci: build log for run ${GITHUB_RUN_NUMBER}" || true
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/liguokun66/BloodPressureAssistant.git" ci-logs || true
